[package]
name = "syncjetty"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Google Drive metadata browser and background engine"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.29"
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"
zeroize = { version = "1", features = ["derive"] }

unicode-width = "0.2"
[dev-dependencies]
tempfile = "3"
